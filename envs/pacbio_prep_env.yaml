name: pacbio_prep_env
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  - python=3.11

  # mapping
  - pbmm2=26.1.99
  - minimap2=2.31
  - samtools=1.23.1
  - htslib=1.23.1
  - pigz

  # refinement
  - isoseq=4.3.0
  - r-base=4.5.1
  - bash=5.2
  - coreutils
  - gsl=2.7

  # demultiplexing
  - lima=2.13.0
  - biopython=1.85
